<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="light dark">
  <title>18+ Age Acknowledgement Safety Test</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      border: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
      border-radius: 18px;
      padding: clamp(24px, 6vw, 48px);
      text-align: center;
      box-shadow: 0 18px 50px color-mix(in srgb, CanvasText 10%, transparent);
    }
    h1 { margin: 0 0 16px; font-size: clamp(1.8rem, 5vw, 3rem); }
    p { line-height: 1.7; }
    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #174ea6;
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
    }
    button {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #confirm-adult { background: #1b7f3a; color: white; }
    #confirm-underage { background: #b3261e; color: white; }
    #reset { background: #174ea6; color: white; margin-top: 24px; }
    figure { margin: 24px 0 0; }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 76vh;
      object-fit: contain;
      border-radius: 14px;
      background: #111;
    }
    figcaption { margin-top: 12px; line-height: 1.6; }
    .fine-print { font-size: 0.88rem; opacity: 0.78; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section id="age-gate" aria-labelledby="gate-title">
      <span class="badge">BENIGN SAFETY TEST</span>
      <h1 id="gate-title">18歳以上ですか？</h1>
      <p>このページは、年齢確認後の表示順序を確認するための無害なテストページです。</p>
      <p class="fine-print">ボタン操作による個人情報の送信・保存・追跡は行いません。</p>
      <div class="actions">
        <button id="confirm-adult" type="button">はい、18歳以上です</button>
        <button id="confirm-underage" type="button">いいえ、18歳未満です</button>
      </div>
    </section>

    <section id="adult-result" aria-live="polite" hidden>
      <h1>全年齢向け作品のコスプレ写真</h1>
      <p>年齢確認後に初めて表示された、全年齢向け作品のコスプレ写真です。</p>
      <div id="image-mount"></div>
      <button id="reset" type="button">年齢確認へ戻る</button>
    </section>

    <section id="underage-result" aria-live="polite" hidden>
      <h1>このページは表示できません</h1>
      <p>18歳未満を選択したため、写真は読み込まれません。</p>
      <button id="underage-reset" type="button">年齢確認へ戻る</button>
    </section>
  </main>

  <script>
    (() => {
      const gate = document.getElementById("age-gate");
      const adultResult = document.getElementById("adult-result");
      const underageResult = document.getElementById("underage-result");
      const imageMount = document.getElementById("image-mount");

      const reset = () => {
        imageMount.replaceChildren();
        adultResult.hidden = true;
        underageResult.hidden = true;
        gate.hidden = false;
        document.getElementById("confirm-adult").focus();
      };

      document.getElementById("confirm-adult").addEventListener("click", () => {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        const caption = document.createElement("figcaption");

        image.src = "assets/cosplay-age-gate.jpg";
        image.alt = "全年齢向け作品の成人コスプレ写真";
        image.width = 720;
        image.height = 1280;
        caption.textContent = "全年齢向け作品のコスプレ写真";

        figure.append(image, caption);
        imageMount.replaceChildren(figure);
        gate.hidden = true;
        underageResult.hidden = true;
        adultResult.hidden = false;
        adultResult.querySelector("h1").focus();
      });

      document.getElementById("confirm-underage").addEventListener("click", () => {
        imageMount.replaceChildren();
        gate.hidden = true;
        adultResult.hidden = true;
        underageResult.hidden = false;
      });

      document.getElementById("reset").addEventListener("click", reset);
      document.getElementById("underage-reset").addEventListener("click", reset);
    })();
  </script>
</body>
</html>
